<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <!-- Uniform Sleeve Badge Specification -->
  <rect width="600" height="450" fill="#F4F8FC"/>

  <g transform="translate(40, 35)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#123B66">
      No.1 RO Service • Uniform Sleeve Badge Specification
    </text>
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B">
      Circular Rubberized Patch / 3D High-Density Embroidery on Left Sleeve
    </text>
  </g>

  <!-- Left Sleeve Patch Mockup (Navy Fabric Background) -->
  <g transform="translate(160, 100)">
    <!-- Polo Sleeve Fabric simulation -->
    <path d="M 0 50 C 40 10, 240 10, 280 50 L 250 300 L 30 300 Z" fill="#123B66" opacity="0.95"/>
    <path d="M 28 290 L 252 290" stroke="#1688D4" stroke-width="6"/>

    <!-- Circular Badge (Centered on Upper Sleeve) -->
    <g transform="translate(140, 150)">
      <circle r="65" fill="#0E2C4D" stroke="#22C7C9" stroke-width="4"/>
      <circle r="57" fill="#123B66" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 3"/>

      <!-- Center Logo Mark -->
      <g transform="translate(-24, -30) scale(1)">
        <path d="M 11 29 C 11 36.8 17.2 43 25 43 C 33.2 43 39.5 36.5 39.5 28 C 39.5 21.8 35.8 16.2 31.5 11.5" stroke="#22C7C9" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="30 8"/>
        <path d="M 24 5 C 24 5 13 18.5 13 28 C 13 34.6 17.9 40 24 40 C 30.1 40 35 34.6 35 28 C 35 18.5 24 5 24 5 Z" fill="#1688D4"/>
        <path d="M 15 30 C 18 34.5 22 36 24 36 C 28 36 32 33 34 28 C 34.2 32.5 31 38.5 24 38.5 C 17.5 38.5 14.2 33.5 15 30 Z" fill="#22C7C9" opacity="0.8"/>
        <path d="M 21 21.5 L 24 19 L 26.5 19 L 26.5 33 L 29 33 L 29 35.5 L 19 35.5 L 19 33 L 21.5 33 L 21.5 22 Z" fill="#FFFFFF"/>
      </g>

      <!-- Badge Curvature Text or Underline -->
      <text y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">
        No.1 RO SERVICE
      </text>
      <text y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#22C7C9" letter-spacing="1">
        CERTIFIED TECHNICIAN
      </text>
    </g>
  </g>
</svg>
