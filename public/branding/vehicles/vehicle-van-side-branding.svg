<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" fill="none">
  <!-- Vehicle Livery Design Specification - Commercial Service Van Side Profile -->
  <defs>
    <linearGradient id="liveryWaveGrad" x1="0" y1="200" x2="1100" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123B66"/>
      <stop offset="0.6" stop-color="#1688D4"/>
      <stop offset="1" stop-color="#22C7C9"/>
    </linearGradient>
    <linearGradient id="vanGlassGrad" x1="0" y1="0" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#334155" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1E293B" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="650" fill="#F4F8FC"/>

  <!-- Technical Spec Grid and Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#123B66">
      No.1 RO Service • Commercial Van Livery Specification (Side Profile)
    </text>
    <text x="0" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B">
      Approved Colors: Primary Navy (#123B66) • Primary Blue (#1688D4) • Aqua (#22C7C9) • White (#FFFFFF)
    </text>
  </g>

  <!-- Van Silhouette Base (Standard Commercial Van: Maruti Eeco / Tata Ace City format) -->
  <g transform="translate(100, 120)">
    <!-- Main Body Shell in Pure White -->
    <path d="M 120 180 L 220 80 C 260 50, 320 40, 420 40 L 880 40 C 930 40, 960 60, 960 110 L 960 360 C 960 380, 940 390, 920 390 L 840 390 C 840 330, 770 330, 770 390 L 370 390 C 370 330, 300 330, 300 390 L 160 390 C 130 390, 100 360, 100 330 L 100 230 C 100 200, 110 190, 120 180 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>

    <!-- Cab Front Window & Passenger Windows -->
    <path d="M 235 85 L 360 85 L 360 170 L 175 170 C 185 140, 205 105, 235 85 Z" fill="url(#vanGlassGrad)"/>
    <path d="M 380 85 L 600 85 L 600 170 L 380 170 Z" fill="url(#vanGlassGrad)"/>
    <path d="M 620 85 L 850 85 L 850 170 L 620 170 Z" fill="url(#vanGlassGrad)"/>

    <!-- Front & Rear Wheel Arches and Wheels -->
    <!-- Front Wheel -->
    <circle cx="335" cy="390" r="58" fill="#1E293B"/>
    <circle cx="335" cy="390" r="38" fill="#64748B"/>
    <circle cx="335" cy="390" r="14" fill="#E2EAF2"/>
    <!-- Rear Wheel -->
    <circle cx="805" cy="390" r="58" fill="#1E293B"/>
    <circle cx="805" cy="390" r="38" fill="#64748B"/>
    <circle cx="805" cy="390" r="14" fill="#E2EAF2"/>

    <!-- Front Bumper, Headlight, Grille -->
    <path d="M 100 270 L 120 270 L 120 300 L 100 300 Z" fill="#E2EAF2" stroke="#CBD5E1"/>
    <rect x="96" y="320" width="30" height="50" rx="8" fill="#475569"/>

    <!-- ==============================================
         APPROVED BRAND GRAPHICS / LIVERY DECAL WRAP
         ============================================== -->
    <!-- Dynamic Purification Wave Swoosh -->
    <path d="M 100 320 C 350 360, 450 260, 700 260 C 820 260, 900 290, 960 310 L 960 360 L 840 360 C 840 330, 770 330, 770 360 L 370 360 C 370 330, 300 330, 300 360 L 100 360 Z" fill="url(#liveryWaveGrad)"/>
    <path d="M 100 310 C 340 350, 440 250, 690 250 C 810 250, 890 280, 960 300" stroke="#22C7C9" stroke-width="8" fill="none" opacity="0.9"/>

    <!-- Large Side Brand Logo -->
    <g transform="translate(400, 195)">
      <!-- Logo Mark -->
      <g transform="translate(0, 0) scale(1.1)">
        <path d="M 11 29 C 11 36.8 17.2 43 25 43 C 33.2 43 39.5 36.5 39.5 28 C 39.5 21.8 35.8 16.2 31.5 11.5" stroke="#22C7C9" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="30 8"/>
        <path d="M 24 5 C 24 5 13 18.5 13 28 C 13 34.6 17.9 40 24 40 C 30.1 40 35 34.6 35 28 C 35 18.5 24 5 24 5 Z" fill="#123B66"/>
        <path d="M 15 30 C 18 34.5 22 36 24 36 C 28 36 32 33 34 28 C 34.2 32.5 31 38.5 24 38.5 C 17.5 38.5 14.2 33.5 15 30 Z" fill="#22C7C9" opacity="0.8"/>
        <path d="M 21 21.5 L 24 19 L 26.5 19 L 26.5 33 L 29 33 L 29 35.5 L 19 35.5 L 19 33 L 21.5 33 L 21.5 22 Z" fill="#FFFFFF"/>
      </g>

      <!-- Wordmark -->
      <text x="62" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800">
        <tspan fill="#123B66">No.1 </tspan>
        <tspan fill="#1688D4">RO </tspan>
        <tspan fill="#172B45">Service</tspan>
      </text>
      <text x="64" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#64748B" letter-spacing="0.5">
        Your Trusted Partner for Pure Water.
      </text>
    </g>

    <!-- Services Bulleted Badge on Vehicle Panel -->
    <g transform="translate(680, 200)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#123B66">
      <rect x="-12" y="-12" width="220" height="70" rx="8" fill="#F4F8FC" stroke="#E2EAF2" stroke-width="1.5"/>
      <text x="0" y="8">• RO Purifier Repair &amp; Service</text>
      <text x="0" y="26">• Filter &amp; Membrane Change</text>
      <text x="0" y="44">• RO Annual Maintenance (AMC)</text>
    </g>

    <!-- Doorstep Support & Domain on Lower Wave -->
    <g transform="translate(420, 340)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">
        DOORSTEP RO SERVICE • HELPLINE: [Configurable Support Phone]
      </text>
      <text x="440" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#22C7C9">
        No1ROService.in
      </text>
    </g>

    <!-- Door Handles & Panel Lines -->
    <line x1="370" y1="85" x2="370" y2="360" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="610" y1="85" x2="610" y2="360" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="340" y="195" width="22" height="7" rx="3.5" fill="#475569"/>
    <rect x="580" y="195" width="22" height="7" rx="3.5" fill="#475569"/>
  </g>
</svg>
