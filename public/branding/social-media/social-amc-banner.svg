<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- RO Annual Maintenance Contract (AMC) Promotional Banner (1200 x 630) -->
  <defs>
    <linearGradient id="amcNavy" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123B66"/>
      <stop offset="1" stop-color="#0E2C4D"/>
    </linearGradient>
    <linearGradient id="amcAqua" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C7C9"/>
      <stop offset="1" stop-color="#1688D4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#amcNavy)"/>

  <!-- Background Shield Glow -->
  <circle cx="950" cy="315" r="260" fill="#1688D4" opacity="0.12"/>
  <circle cx="950" cy="315" r="180" fill="#22C7C9" opacity="0.08"/>

  <!-- Left Content -->
  <g transform="translate(80, 80)">
    <!-- Small Brand Logo -->
    <g transform="translate(0, 0)">
      <g transform="translate(0, 0) scale(1.1)">
        <path d="M 11 29 C 11 36.8 17.2 43 25 43 C 33.2 43 39.5 36.5 39.5 28 C 39.5 21.8 35.8 16.2 31.5 11.5" stroke="#22C7C9" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="30 8"/>
        <path d="M 24 5 C 24 5 13 18.5 13 28 C 13 34.6 17.9 40 24 40 C 30.1 40 35 34.6 35 28 C 35 18.5 24 5 24 5 Z" fill="#1688D4"/>
        <path d="M 15 30 C 18 34.5 22 36 24 36 C 28 36 32 33 34 28 C 34.2 32.5 31 38.5 24 38.5 C 17.5 38.5 14.2 33.5 15 30 Z" fill="#22C7C9" opacity="0.8"/>
        <path d="M 21 21.5 L 24 19 L 26.5 19 L 26.5 33 L 29 33 L 29 35.5 L 19 35.5 L 19 33 L 21.5 33 L 21.5 22 Z" fill="#FFFFFF"/>
      </g>
      <text x="60" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">
        <tspan fill="#FFFFFF">No.1 </tspan>
        <tspan fill="#22C7C9">RO </tspan>
        <tspan fill="#FFFFFF">Service</tspan>
      </text>
    </g>

    <!-- AMC Tagline -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="220" height="30" rx="15" fill="#22C7C9" opacity="0.2"/>
      <text x="16" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#22C7C9" letter-spacing="1">
        PROTECT YOUR PURIFIER
      </text>

      <text x="0" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">
        Comprehensive Annual
      </text>
      <text x="0" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="url(#amcAqua)">
        Maintenance Plans (AMC)
      </text>
      <text x="0" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="500" fill="#CBD5E1">
        Enjoy 365 days of hassle-free pure water with scheduled filter changes &amp; breakdowns covered.
      </text>
    </g>

    <!-- Plan Highlights -->
    <g transform="translate(0, 300)" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
      <text x="0" y="0"><tspan fill="#22C7C9">✓</tspan> Scheduled Service Visits</text>
      <text x="280" y="0"><tspan fill="#22C7C9">✓</tspan> Free Filter Replacements</text>
      <text x="0" y="36"><tspan fill="#22C7C9">✓</tspan> Electrical Parts Protection</text>
      <text x="280" y="36"><tspan fill="#22C7C9">✓</tspan> Priority Doorstep Support</text>
    </g>

    <!-- CTA Button & Contact -->
    <g transform="translate(0, 390)">
      <rect width="220" height="54" rx="12" fill="#1688D4"/>
      <text x="110" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">
        VIEW AMC PLANS →
      </text>

      <text x="260" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#22C7C9">
        Helpline: [Configurable Support Phone]
      </text>
    </g>
  </g>

  <!-- Right Shield Illustration -->
  <g transform="translate(950, 315)">
    <!-- Shield Outline -->
    <path d="M 0 -130 L 110 -80 L 110 40 C 110 110, 0 170, 0 170 C 0 170, -110 110, -110 40 L -110 -80 Z" fill="#0E2C4D" stroke="#1E4E80" stroke-width="4"/>
    <path d="M 0 -115 L 95 -70 L 95 35 C 95 95, 0 150, 0 150 C 0 150, -95 95, -95 35 L -95 -70 Z" fill="#123B66" stroke="#22C7C9" stroke-width="2"/>

    <!-- Inner Checkmark & Droplet -->
    <circle cx="0" cy="0" r="45" fill="#1688D4"/>
    <path d="M -16 0 L -5 12 L 18 -12" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">
      365 DAYS CARE
    </text>
    <text y="95" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#22C7C9">
      PEACE OF MIND
    </text>
  </g>
</svg>
