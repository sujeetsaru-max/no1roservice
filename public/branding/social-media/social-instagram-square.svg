      </text>
      <text x="20" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">
        Year-round coverage
      </text>
    </g>
  </g>

  <!-- Call-to-Action Bottom Banner -->
  <g transform="translate(80, 760)">
    <rect width="920" height="200" rx="20" fill="#FFFFFF"/>
    <g transform="translate(40, 50)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="900" fill="#123B66">
