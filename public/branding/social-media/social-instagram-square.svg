    </g>

    <g transform="translate(680, 65)">
      <rect width="200" height="60" rx="12" fill="#1688D4"/>
      <text x="100" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">
        BOOK NOW →
      </text>
    </g>
  </g>

  <!-- Bottom Brand Signature -->
  <text x="540" y="1030" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#22C7C9" letter-spacing="1.5">
