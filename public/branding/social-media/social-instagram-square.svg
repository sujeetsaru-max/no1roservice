<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" fill="none">
  <!-- 1:1 Instagram Square Post Concept (1080 x 1080) -->
  <defs>
    <linearGradient id="instaNavyGrad" x1="0" y1="0" x2="1080" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123B66"/>
      <stop offset="0.6" stop-color="#0E2C4D"/>
      <stop offset="1" stop-color="#0A213A"/>
    </linearGradient>
    <linearGradient id="instaAquaGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C7C9"/>
      <stop offset="1" stop-color="#1688D4"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#instaNavyGrad)"/>

  <!-- Background Water Purification Waves -->
  <path d="M 0 700 C 300 650, 700 850, 1080 720 L 1080 1080 L 0 1080 Z" fill="#1688D4" opacity="0.12"/>
  <path d="M 0 740 C 350 680, 650 900, 1080 770 L 1080 1080 L 0 1080 Z" fill="#22C7C9" opacity="0.08"/>

  <!-- Top Logo Bar -->
  <g transform="translate(80, 70)">
    <g transform="translate(0, 0) scale(1.3)">
      <path d="M 11 29 C 11 36.8 17.2 43 25 43 C 33.2 43 39.5 36.5 39.5 28 C 39.5 21.8 35.8 16.2 31.5 11.5" stroke="#22C7C9" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="30 8"/>
      <path d="M 24 5 C 24 5 13 18.5 13 28 C 13 34.6 17.9 40 24 40 C 30.1 40 35 34.6 35 28 C 35 18.5 24 5 24 5 Z" fill="#1688D4"/>
      <path d="M 15 30 C 18 34.5 22 36 24 36 C 28 36 32 33 34 28 C 34.2 32.5 31 38.5 24 38.5 C 17.5 38.5 14.2 33.5 15 30 Z" fill="#22C7C9" opacity="0.8"/>
      <path d="M 21 21.5 L 24 19 L 26.5 19 L 26.5 33 L 29 33 L 29 35.5 L 19 35.5 L 19 33 L 21.5 33 L 21.5 22 Z" fill="#FFFFFF"/>
    </g>
    <text x="76" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800">
      <tspan fill="#FFFFFF">No.1 </tspan>
      <tspan fill="#22C7C9">RO </tspan>
      <tspan fill="#FFFFFF">Service</tspan>
    </text>
    <text x="78" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#E2EAF2">
      Your Trusted Partner for Pure Water.
    </text>
  </g>

  <!-- Central Visual Container / Headline -->
  <g transform="translate(80, 240)">
    <rect x="0" y="0" width="340" height="38" rx="19" fill="#22C7C9" opacity="0.2"/>
    <text x="24" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#22C7C9" letter-spacing="1.5">
