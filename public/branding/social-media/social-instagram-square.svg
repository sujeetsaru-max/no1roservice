    </g>

    <g transform="translate(640, 0)">
      <rect width="280" height="90" rx="14" fill="#0E2C4D" stroke="#1E4E80" stroke-width="2"/>
      <text x="20" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#22C7C9">
