<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800" height="1130" fill="none">
  <!-- A4 Ratio Canvas: 800 x 1130 -->
  <rect width="800" height="1130" fill="#FFFFFF"/>
  <rect width="800" height="1130" stroke="#E2EAF2" stroke-width="2"/>

  <!-- Top Decorative Header Geometry -->
  <path d="M 0 0 L 800 0 L 800 18 L 0 18 Z" fill="#123B66"/>
  <path d="M 550 18 L 800 18 L 800 24 L 520 24 Z" fill="#22C7C9"/>
  <path d="M 350 18 L 540 18 L 510 24 L 320 24 Z" fill="#1688D4"/>

  <!-- Top Logo & Company Info -->
  <g transform="translate(60, 50)">
    <!-- Logo Mark -->
    <g transform="translate(0, 0)">
      <path d="M 11 29 C 11 36.8 17.2 43 25 43 C 33.2 43 39.5 36.5 39.5 28 C 39.5 21.8 35.8 16.2 31.5 11.5" stroke="#22C7C9" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="30 8"/>
      <path d="M 24 5 C 24 5 13 18.5 13 28 C 13 34.6 17.9 40 24 40 C 30.1 40 35 34.6 35 28 C 35 18.5 24 5 24 5 Z" fill="#1688D4"/>
      <path d="M 15 30 C 18 34.5 22 36 24 36 C 28 36 32 33 34 28 C 34.2 32.5 31 38.5 24 38.5 C 17.5 38.5 14.2 33.5 15 30 Z" fill="#22C7C9" opacity="0.8"/>
      <path d="M 21 21.5 L 24 19 L 26.5 19 L 26.5 33 L 29 33 L 29 35.5 L 19 35.5 L 19 33 L 21.5 33 L 21.5 22 Z" fill="#FFFFFF"/>
    </g>

    <!-- Wordmark -->
    <text x="56" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800">
      <tspan fill="#123B66">No.1 </tspan>
      <tspan fill="#1688D4">RO </tspan>
      <tspan fill="#172B45">Service</tspan>
    </text>
    <text x="58" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#64748B" letter-spacing="0.5">
      Your Trusted Partner for Pure Water.
    </text>
  </g>

  <!-- Right Contact Summary -->
  <g transform="translate(740, 56)" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#64748B">
    <text y="0">Website: <tspan font-weight="700" fill="#1688D4">No1ROService.in</tspan></text>
    <text y="16">Email: support@no1roservice.in</text>
    <text y="32">Support: [Configurable Support Helpline]</text>
  </g>

  <line x1="60" y1="120" x2="740" y2="120" stroke="#E2EAF2" stroke-width="1.5"/>

  <!-- Subtle Central Watermark -->
  <g transform="translate(400, 565)" opacity="0.04" text-anchor="middle">
    <circle r="140" fill="#1688D4"/>
    <text y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="800" fill="#123B66">
      No.1 RO Service
    </text>
  </g>

  <!-- Body Content Mockup Lines -->
  <g transform="translate(60, 180)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#172B45">
    <text x="0" y="0" font-weight="700" fill="#123B66">REF: N1RO/DOC/2026/001</text>
    <text x="680" y="0" text-anchor="end" fill="#64748B">Date: [DD/MM/YYYY]</text>

    <text x="0" y="40" font-weight="700">To,</text>
    <text x="0" y="60">[Client / Partner Name]</text>
    <text x="0" y="78">[Address / Organization Details]</text>

    <!-- Placeholder Letter Body -->
    <g transform="translate(0, 120)" fill="#64748B" font-size="10.5">
      <rect x="0" y="0" width="680" height="8" rx="4" fill="#F4F8FC"/>
      <rect x="0" y="20" width="640" height="8" rx="4" fill="#F4F8FC"/>
      <rect x="0" y="40" width="660" height="8" rx="4" fill="#F4F8FC"/>
      <rect x="0" y="60" width="580" height="8" rx="4" fill="#F4F8FC"/>

      <rect x="0" y="100" width="680" height="8" rx="4" fill="#F4F8FC"/>
      <rect x="0" y="120" width="650" height="8" rx="4" fill="#F4F8FC"/>
      <rect x="0" y="140" width="670" height="8" rx="4" fill="#F4F8FC"/>
      <rect x="0" y="160" width="450" height="8" rx="4" fill="#F4F8FC"/>
    </g>

    <!-- Sign-off -->
    <g transform="translate(0, 480)">
      <text x="0" y="0" font-weight="600" fill="#123B66">Sincerely,</text>
      <text x="0" y="40" font-weight="700" fill="#123B66">Authorized Signatory</text>
      <text x="0" y="58" font-size="9.5" fill="#64748B">No.1 RO Service Operations</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="60" y1="1060" x2="740" y2="1060" stroke="#E2EAF2" stroke-width="1.5"/>
  <g transform="translate(400, 1085)" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B">
    <text y="0">No.1 RO Service • Professional Water Purifier Installation, Repair, AMC &amp; Maintenance</text>
    <text y="16" fill="#1688D4" font-weight="600">Official Portal: https://no1roservice.in</text>
  </g>
  <rect x="0" y="1122" width="800" height="8" fill="#123B66"/>
</svg>
