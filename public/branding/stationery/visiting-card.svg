<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600" fill="none">
  <!-- Standard Business Card Dimensions (3.5" x 2" proportional at 300 DPI scale) -->
  <defs>
    <linearGradient id="cardNavyGrad" x1="0" y1="0" x2="500" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123B66"/>
      <stop offset="1" stop-color="#0E2C4D"/>
    </linearGradient>
    <linearGradient id="cardAquaAccent" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C7C9"/>
      <stop offset="1" stop-color="#1688D4"/>
    </linearGradient>
  </defs>

  <!-- SIDE A: Front (Premium Navy Theme) -->
  <g transform="translate(20, 50)">
    <rect width="480" height="280" rx="16" fill="url(#cardNavyGrad)" stroke="#1E4E80" stroke-width="2"/>
    <rect x="0" y="272" width="480" height="8" rx="4" fill="url(#cardAquaAccent)"/>
    
    <!-- Water filtration wave curve in background -->
    <path d="M 0 160 C 140 180, 260 120, 480 200 L 480 280 L 0 280 Z" fill="#22C7C9" opacity="0.08"/>
    
    <!-- Center Logo & Branding -->
    <g transform="translate(110, 85)">
      <!-- Logo Mark -->
      <path d="M 11 29 C 11 36.8 17.2 43 25 43 C 33.2 43 39.5 36.5 39.5 28 C 39.5 21.8 35.8 16.2 31.5 11.5" stroke="#22C7C9" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="30 8"/>
      <path d="M 24 5 C 24 5 13 18.5 13 28 C 13 34.6 17.9 40 24 40 C 30.1 40 35 34.6 35 28 C 35 18.5 24 5 24 5 Z" fill="#1688D4"/>
      <path d="M 15 30 C 18 34.5 22 36 24 36 C 28 36 32 33 34 28 C 34.2 32.5 31 38.5 24 38.5 C 17.5 38.5 14.2 33.5 15 30 Z" fill="#22C7C9" opacity="0.8"/>
      <path d="M 21 21.5 L 24 19 L 26.5 19 L 26.5 33 L 29 33 L 29 35.5 L 19 35.5 L 19 33 L 21.5 33 L 21.5 22 Z" fill="#FFFFFF"/>
      
      <!-- Wordmark -->
      <text x="56" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800">
        <tspan fill="#FFFFFF">No.1 </tspan>
        <tspan fill="#22C7C9">RO </tspan>
        <tspan fill="#FFFFFF">Service</tspan>
      </text>
      <text x="58" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#E2EAF2" letter-spacing="0.5">
        Your Trusted Partner for Pure Water.
      </text>
    </g>
    
    <text x="240" y="235" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#22C7C9" letter-spacing="2">
      No1ROService.in
    </text>
  </g>

  <!-- SIDE B: Back (Information & Cardholder) -->
  <g transform="translate(540, 50)">
    <rect width="480" height="280" rx="16" fill="#FFFFFF" stroke="#E2EAF2" stroke-width="2"/>
    <rect x="0" y="0" width="8" height="280" rx="4" fill="#123B66"/>
    <rect x="0" y="0" width="480" height="6" fill="#1688D4"/>

    <!-- Small Header Logo -->
    <g transform="translate(30, 25)">
      <text x="0" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">
        <tspan fill="#123B66">No.1 </tspan>
        <tspan fill="#1688D4">RO </tspan>
        <tspan fill="#172B45">Service</tspan>
      </text>
    </g>

    <!-- Cardholder Info -->
    <g transform="translate(30, 85)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#123B66">
        [Cardholder Name]
      </text>
      <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#1688D4">
        Senior RO Service Engineer / Manager
      </text>
      <line x1="0" y1="28" x2="220" y2="28" stroke="#E2EAF2" stroke-width="1.5"/>
    </g>

    <!-- Contact Details Placeholders -->
    <g transform="translate(30, 145)" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#172B45">
      <text x="0" y="0">📞 Helpline: [Configurable Support Phone]</text>
      <text x="0" y="22">✉️ Email: support@no1roservice.in</text>
      <text x="0" y="44">🌐 Website: www.no1roservice.in</text>
      <text x="0" y="66">📍 Doorstep Service Across All Major Cities</text>
    </g>

    <!-- QR Code Placeholder Frame -->
    <g transform="translate(370, 120)">
      <rect width="80" height="80" rx="8" fill="#F4F8FC" stroke="#E2EAF2" stroke-width="1.5"/>
      <rect x="12" y="12" width="20" height="20" fill="#123B66"/>
      <rect x="48" y="12" width="20" height="20" fill="#123B66"/>
      <rect x="12" y="48" width="20" height="20" fill="#123B66"/>
      <rect x="38" y="38" width="12" height="12" fill="#22C7C9"/>
      <text x="40" y="94" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#64748B">
        SCAN TO BOOK
      </text>
    </g>
  </g>
</svg>
